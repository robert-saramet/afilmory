name: Update Photo Content

on:
  workflow_dispatch:

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run Manifest Builder
        env:
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_CUSTOM_DOMAIN: ${{ vars.S3_CUSTOM_DOMAIN }}
        run: pnpm run build:manifest

      - name: Archive Photo Assets
        run: tar -czf photo-assets.tar.gz -C apps/web/public photos-manifest.json thumbnails

      - name: Upload Photo Assets Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-assets
          path: photo-assets.tar.gz
          retention-days: 90
